<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 627px;
    background: #0B0C10;
    color: #F4F5F7;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 627px;
  }
  .glow {
    position: absolute;
    top: -260px;
    right: -220px;
    width: 680px;
    height: 680px;
    border-radius: 50%;
    background: #132033;
  }
  .glow2 {
    position: absolute;
    bottom: -300px;
    left: -220px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: #0E1620;
  }
  .logo {
    position: absolute;
    top: 56px;
    left: 64px;
    height: 24px;
    width: auto;
    display: block;
    opacity: 0.92;
  }
  .content {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 220px;
  }
  .headline {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.18;
    letter-spacing: -0.02em;
    color: #F4F5F7;
    max-width: 1040px;
  }
  .accent-bar {
    position: absolute;
    left: 64px;
    top: 172px;
    width: 64px;
    height: 6px;
    border-radius: 3px;
    background: #2E9BFF;
  }
  .kicker {
    position: absolute;
    left: 64px;
    bottom: 56px;
    font-size: 16px;
    color: #6B7280;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="glow2"></div>
    <img class="logo" src="../logo.png" alt="agentworth">
    <div class="accent-bar"></div>
    <div class="content">
      <div class="headline">{{HEADLINE}}</div>
    </div>
    <div class="kicker">agentworth.cloud</div>
  </div>
</body>
</html>
