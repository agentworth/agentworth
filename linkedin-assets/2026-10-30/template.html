<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 627px;
    background: #0B0C10;
    color: #F4F5F7;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 627px;
  }
  .glow {
    display: none;
  }
  .eyebrow {
    position: absolute;
    top: 64px;
    left: 64px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.14em;
    color: #2E9BFF;
    text-transform: uppercase;
  }
  .headline {
    position: absolute;
    top: 118px;
    left: 64px;
    right: 120px;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 54px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: #F4F5F7;
    max-width: 920px;
  }
  .icon-wrap {
    position: absolute;
    right: 90px;
    bottom: 90px;
    width: 190px;
    height: 190px;
  }
  .wordmark {
    position: absolute;
    left: 64px;
    bottom: 56px;
    display: flex;
    align-items: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: #F4F5F7;
  }
  .wordmark .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #2E9BFF;
    margin-left: 6px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="eyebrow">WHAT AUDIT LOGS MISS</div>
    <div class="headline">Busy is not the same as right</div>
    <div class="icon-wrap">
      <svg viewBox="0 0 200 200" width="190" height="190" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#2E9BFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="90" cy="90" r="40"/><line x1="120" y1="120" x2="160" y2="160"/>
        </g>
      </svg>
    </div>
    <div class="wordmark">agentworth<span class="dot"></span></div>
  </div>
</body>
</html>
